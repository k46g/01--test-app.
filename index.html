<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درب المسلم - النسخة الكاملة أوفلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Amiri&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            transition: background-color 0.3s; 
            background: linear-gradient(135deg, #f3f4f6 0%, #ecfdf5 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }
        html.dark body {
            background: linear-gradient(135deg, #111827 0%, #064e3b 100%);
        }
        /* خط المصحف الشريف وضبط المحاذاة */
        .quran-font { 
            font-family: 'Amiri', serif; 
            line-height: 2.4; 
            text-align: justify; 
            text-justify: inter-word; 
        }
        .page { 
            display: none; 
            min-height: 100vh; 
            padding-bottom: 100px; 
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .page.active { 
            display: block; 
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .green-card { 
            background: linear-gradient(135deg, #059669, #064e3b); 
            border-radius: 2rem; 
        }
        .surah-card {
            transition: all 0.2s ease;
        }
        .surah-card:active {
            transform: scale(0.95);
        }
        .nav-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; 
            padding: 12px; z-index: 1000; border-radius: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        .dark .nav-bar { background: rgba(31, 41, 55, 0.85); }
    </style>
</head>
<body class="dark:text-white">

<div class="max-w-md mx-auto relative min-h-screen p-4">

    <div id="homePage" class="page active">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h1 class="text-xl font-bold text-emerald-800 dark:text-emerald-400">درب المسلم 🌤️</h1>
            <button onclick="toggleDarkMode()" class="p-2 bg-white dark:bg-gray-800 rounded-xl shadow-md">🌓</button>
        </div>
        
        <div class="green-card p-6 mb-8 text-white shadow-xl relative overflow-hidden">
            <p class="text-xs opacity-70 mb-1" id="todayDate">جاري تحميل التاريخ...</p>
            <h2 class="text-lg font-bold mb-2 text-yellow-300">تذكير اليوم</h2>
            <div class="text-lg quran-font">"فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ"</div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="showPage('quranPage')" class="bg-white dark:bg-gray-800 p-8 rounded-[2rem] text-center shadow-md border border-gray-100 dark:border-gray-700/50">
                <span class="text-4xl block mb-2">📖</span>
                <p class="font-bold text-sm text-emerald-900 dark:text-emerald-300">المصحف كاملاً</p>
                <p class="text-[10px] opacity-50 mt-1">114 سورة بدون نت</p>
            </button>
            <button onclick="showPage('azkarPage')" class="bg-white dark:bg-gray-800 p-8 rounded-[2rem] text-center shadow-md border border-gray-100 dark:border-gray-700/50">
                <span class="text-4xl block mb-2">📿</span>
                <p class="font-bold text-sm text-emerald-900 dark:text-emerald-300">الأذكار</p>
                <p class="text-[10px] opacity-50 mt-1">حصن المسلم</p>
            </button>
        </div>
    </div>

    <div id="azkarPage" class="page">
        <div class="flex items-center gap-4 mb-6 mt-4">
            <button onclick="showPage('homePage')" class="text-emerald-600 text-xl font-bold bg-white dark:bg-gray-800 px-3 py-1 rounded-xl shadow-sm">←</button>
            <h2 class="text-xl font-bold">الأذكار اليومية</h2>
        </div>
        <div class="space-y-4">
            <div class="p-5 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm text-right">
                <p class="text-emerald-600 font-bold text-sm mb-1">تذكير</p>
                <p class="text-md font-semibold">لا تنسَ قراءة أذكار الصباح والمساء لحفظك طوال اليوم.</p>
            </div>
        </div>
    </div>

    <div id="quranPage" class="page">
        <div class="flex items-center gap-4 mb-4 mt-4">
            <button onclick="showPage('homePage')" class="text-emerald-600 text-xl font-bold bg-white dark:bg-gray-800 px-3 py-1 rounded-xl shadow-sm">←</button>
            <h2 class="text-xl font-bold">المصحف الشريف كاملاً</h2>
        </div>
        
        <input id="searchSurah" oninput="filterSurahs()" type="text" placeholder="ابحث عن اسم السورة..." class="w-full p-4 mb-4 rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-right outline-none focus:border-emerald-500 shadow-sm">
        
        <div id="surahList" class="space-y-2 max-h-[65vh] overflow-y-auto pr-1">
            <p class="text-center opacity-50 py-10">جاري تحميل المصحف الشريف من ملف quran.json...</p>
        </div>
    </div>

    <div id="surahView" class="page">
        <div class="flex justify-between items-center mb-6 mt-4">
            <button onclick="showPage('quranPage')" class="text-emerald-600 font-bold bg-white dark:bg-gray-800 px-4 py-2 rounded-xl shadow-sm">← الفهرس</button>
            <span id="surahMeta" class="text-xs opacity-60 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 px-3 py-1 rounded-full font-bold"></span>
        </div>
        <div id="surahContent" class="bg-white dark:bg-gray-800 p-6 rounded-[2.5rem] quran-font text-2xl text-right shadow-md border border-gray-100 dark:border-gray-700 select-text">
            </div>
    </div>

    <nav class="nav-bar">
        <button onclick="showPage('homePage')" class="flex flex-col items-center font-bold text-xs text-emerald-700 dark:text-emerald-400">
            <span class="text-xl mb-0.5">🏠</span>الرئيسية
        </button>
        <button onclick="showPage('quranPage')" class="flex flex-col items-center font-bold text-xs opacity-60 hover:opacity-100">
            <span class="text-xl mb-0.5">📖</span>المصحف
        </button>
    </nav>
</div>

<script>
    let quranData = [];

    // الدالة الأساسية لجلب ملف القرآن المحلي المرتبط بالتسمية الصحيحة quran.json
    async function loadQuranData() {
        try {
            // إضافة كسر الكاش لضمان قراءة الملف المحدث فوراً من السيرفر وبدون كاش متصفح قديم
            const response = await fetch('quran.json?v=' + new Date().getTime());
            quranData = await response.json();
            renderIndex(quranData); 
        } catch (error) {
            console.error("خطأ في تحميل ملف القرآن:", error);
            document.getElementById('surahList').innerHTML = `
                <div class="p-4 bg-red-50 text-red-600 dark:bg-red-950/20 dark:text-red-400 rounded-2xl text-center text-sm font-bold">
                    تنبيه: لم يتم العثور على ملف بالاسم الصحيح <code class="bg-white px-1 py-0.5 rounded border">quran.json</code> بجانب هذا الكود.<br>
                    تأكد أن الاسم مطابق 100% وبدون مسافات أو نقاط زائدة لتختفي هذه الرسالة.
                </div>`;
        }
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function renderIndex(data) {
        const container = document.getElementById('surahList');
        if (data.length === 0) {
            container.innerHTML = `<p class="text-center opacity-50 py-4">لا توجد نتائج مطابقة</p>`;
            return;
        }
        container.innerHTML = data.map(surah => `
            <div onclick="openSurah(${surah.id})" class="surah-card p-4 bg-white dark:bg-gray-800 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-emerald-50 dark:hover:bg-emerald-950/20 border border-gray-100 dark:border-gray-700/40 shadow-sm">
                <span class="text-xs opacity-50 bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-lg">آياتها: ${surah.verses.length}</span>
                <span class="font-bold text-gray-800 dark:text-gray-200">${surah.id}. سورة ${surah.name} 📖</span>
            </div>
        `).join('');
    }

    function openSurah(id) {
        showPage('surahView');
        const surah = quranData.find(s => s.id === id);
        
        if (surah) {
            document.getElementById('surahMeta').innerText = `ترتيبها: ${surah.id} | آياتها: ${surah.verses.length}`;
            
            // البسملة لجميع السور ما عدا التوبة والفاتحة
            let basmalah = (id !== 1 && id !== 9) ? `<p class="text-center text-2xl text-emerald-600 dark:text-emerald-400 mb-6 font-serif">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>` : '';
            
            // ربط وعرض نصوص الآيات بدقة مع أرقامها المرتبة
            let versesText = surah.verses.map(v => `${v.text} <span class="text-emerald-600 dark:text-emerald-400 font-sans font-bold text-lg mx-1">﴿${v.id}﴾</span>`).join(' ');
            
            document.getElementById('surahContent').innerHTML = `
                <h2 class="text-center mb-1 text-emerald-800 dark:text-emerald-400 font-bold text-2xl font-serif">سورة ${surah.name}</h2>
                <div class="w-24 h-0.5 bg-emerald-200 dark:bg-emerald-800 mx-auto mb-6"></div>
                ${basmalah}
                <div class="leading-loose text-right select-text text-gray-800 dark:text-gray-100 p-2">${versesText}</div>
            `;
        }
    }

    function filterSurahs() {
        const query = document.getElementById('searchSurah').value.trim();
        const filtered = quranData.filter(s => s.name.includes(query));
        renderIndex(filtered);
    }

    function toggleDarkMode() { 
        document.documentElement.classList.toggle('dark'); 
    }

    function init() {
        const now = new Date();
        document.getElementById('todayDate').innerText = now.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        loadQuranData();
    }

    init();
</script>
</body>
</html>
